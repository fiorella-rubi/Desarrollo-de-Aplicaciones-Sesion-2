<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio Web - Contacto</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div id="contenedor">
        <header id="cabecera">
            <h1>Portal Central</h1>
            <nav>
                <ul>
                    <li class="nav-item"><a href="index.html" class="btn-nav">Inicio</a></li>
                    <li class="nav-item"><a href="articulos.html" class="btn-nav">Artículos</a></li>
                    <li class="nav-item"><a href="contacto.html" class="btn-nav">Contacto</a></li>
                </ul>
            </nav>
        </header>

        <main id="contenido">
            <h2>Formulario de Mensaje</h2>
            <p>Ponte en contacto enviando tus datos a través de los siguientes campos.</p>

            <form>
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre">

                <label for="correo">Correo electrónico:</label>
                <input type="text" id="correo" name="correo">

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje"></textarea>

                <button type="submit" class="btn-accion">Enviar Datos</button>
            </form>
        </main>

        <footer>
            <p>cosoasd.</p>
        </footer>
    </div>
</body>
</html>
