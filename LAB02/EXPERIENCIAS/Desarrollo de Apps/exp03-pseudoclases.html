<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Exp 03b - Pseudo Clases</title>
  <link rel="stylesheet" href="pseudoclases.css">
</head>
<body>

  <h1>Pseudo Clases</h1>

  <a href="#">Pasa el mouse (hover)</a>
  <br><br>

  <button>Haz clic y mantén (active)</button>
  <br><br>

  <input type="text" placeholder="Haz foco aquí (focus)">
  <br><br>

  <ul>
    <li>Elemento 1 (first-child)</li>
    <li>Elemento 2</li>
    <li>Elemento 3</li>
    <li>Elemento 4 (last-child)</li>
  </ul>

  <ul>
    <li>Impar</li>
    <li>Par (nth-child)</li>
    <li>Impar</li>
    <li>Par (nth-child)</li>
  </ul>

  <form>
    <input type="checkbox"> Marcar (checked)
    <br><br>
    <input type="text" disabled placeholder="Deshabilitado (disabled)">
    <br><br>
    <input type="text" required placeholder="Obligatorio (required)">
    <br><br>
    <input type="email" placeholder="Escribe un correo (valid/invalid)">
  </form>

  <p>Este es un párrafo normal, <span>excepto este span (not)</span>.</p>

</body>
</html>
