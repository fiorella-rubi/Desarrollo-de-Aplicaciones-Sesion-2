<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Exp 02 - Selectores por Clase</title>
  <link rel="stylesheet" href="clase.css">
</head>
<body>

  <header class="encabezado">
    <h1 class="titulo-principal">Encabezado Principal</h1>
    <p class="texto-destacado">Este es un párrafo dentro del header.</p>
  </header>

  <section class="seccion">
    <h2 class="subtitulo">Sección 1</h2>
    <p class="texto-normal">Párrafo de la sección 1.</p>
    <ul class="lista">
      <li>Elemento de lista 1</li>
      <li>Elemento de lista 2</li>
    </ul>
  </section>

  <section class="seccion">
    <h2 class="subtitulo">Sección 2</h2>
    <p class="texto-normal">Párrafo de la sección 2.</p>
    <a class="enlace" href="#">Un enlace de ejemplo</a>
  </section>

  <footer class="pie">
    <p>Pie de página</p>
  </footer>

</body>
</html>
